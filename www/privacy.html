<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duttarim — Gizlilik Politikası</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:28px 20px;line-height:1.65;color:#2d2d2d;background:#faf8f3}h1{margin:14px 0 6px}h2{margin-top:26px}.updated{color:#777;font-size:14px}.privacy-back,.lang button{border:1px solid #d9d5cc;background:#fff;color:#2d2d2d;border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer}.lang{display:flex;gap:8px;margin:14px 0}.lang button.active{background:#1f9eaa;color:#fff;border-color:#1f9eaa}</style></head><body>
<button class="privacy-back" id="privacyBack">← Duttarim'e dön</button><div class="lang" role="group" aria-label="Language"><button data-lang="tr" class="active">Türkçe</button><button data-lang="en">English</button><button data-lang="ug">ئۇيغۇرچە</button></div><main id="policy"></main>
<script>
const policies={
tr:{title:'Gizlilik Politikası',date:'Son güncelleme: 26 Ağustos 2026',intro:'Duttarim, dutar için geliştirilmiş bir akort uygulamasıdır. Bu politika, izinlerin ve bilgilerin uygulama kullanılırken nasıl işlendiğini açıklar.',sections:[['Mikrofon erişimi','Duttarim dutar sesini algılayıp perdeyi belirlemek için mikrofon izni ister. Ses yalnızca cihazda gerçek zamanlı işlenir; kayıt oluşturulmaz, ses yüklenmez veya paylaşılmaz. Akort durdurulunca işlem sona erer.'],['Toplanan bilgiler','Hesap, giriş, profil, ad, e-posta, telefon, konum, kişiler veya fotoğraf istenmez.'],['Cihazda saklanan tercihler','Dil, nota gösterimi, referans frekansı, ilk kurulum durumu, favoriler ve çevrimdışı nota kataloğu cihazın yerel depolamasında tutulabilir. Bunlar sunucuya gönderilmez; uygulama verileri silinerek kaldırılabilir.'],['İnternet ve katalog','Akort için internet gerekmez. Bağlantı varsa resmi nota kataloğundaki yeni içerikler ve görseller indirilir, cihazda önbelleğe alınabilir.'],['Analiz ve reklam','Bu sürümde reklam, davranışsal takip, analiz veya üçüncü taraf profil oluşturma SDK’sı bulunmaz.'],['Yayınlama yönetimi','Kısıtlı yayınlama ekranı yalnızca yetkili yönetici içindir. Yönetici tarafından seçilen nota bilgileri şifreli bağlantıyla resmi yayın hizmetine gönderilir.'],['Veri paylaşımı','Duttarim kişisel bilgileri satmaz. GitHub Pages ve Cloudflare, hizmet sunumu sırasında sınırlı teknik verileri kendi politikalarına göre işleyebilir.'],['Çocukların gizliliği','Uygulama hesap oluşturmayı gerektirmez ve çocuklardan bilerek kişisel bilgi istemez.'],['Değişiklikler ve iletişim','Politika yeni özelliklerle güncellenebilir. Sorularınız için duttarim.app@gmail.com adresine yazabilirsiniz.']]},
en:{title:'Privacy Policy',date:'Last updated: August 26, 2026',intro:'Duttarim is a dutar tuning app. This policy explains how permissions and information are handled while you use the app.',sections:[['Microphone access','Duttarim requests microphone access to detect dutar sound and determine pitch. Audio is processed in real time on the device only; no recording is created and audio is not uploaded or shared.'],['Information collected','The app does not require an account, sign-in, profile, name, email, phone number, location, contacts, or photos.'],['Local preferences','Language, notation, reference frequency, setup status, favorites, and a cached catalog may be stored locally. They are not uploaded and can be removed by clearing app data.'],['Internet and catalog','Internet is not required for tuning. Official catalog content may be downloaded and cached when available.'],['Analytics and advertising','This version contains no advertising, behavioral tracking, analytics, or profiling SDKs.'],['Publishing administration','A restricted publishing screen is for authorized administrators. Selected score data is sent over an encrypted connection to the official publishing service.'],['Data sharing','Duttarim does not sell personal information. GitHub Pages and Cloudflare may process limited technical request data under their own policies.'],["Children's privacy",'The app does not require an account and does not knowingly request personal information from children.'],['Changes and contact','This policy may change as features are added. Contact duttarim.app@gmail.com with questions.']]},
ug:{title:'مەخپىيەتلىك سىياسىتى',date:'ئاخىرقى يېڭىلاش: 2026-يىلى 26-ئاۋغۇست',intro:'Duttarim دۇتارنى تەڭشەش ئەپى. بۇ سىياسەت ئىجازەت ۋە ئۇچۇرلارنىڭ قانداق ئىشلىتىلىدىغانلىقىنى چۈشەندۈرىدۇ.',sections:[['مىكروفون ئىجازىتى','ئەپلە دۇتار ئاۋازىنى ئۈسكۈنىدە دەرھال تەھلىل قىلىپ پەردىنى تاپىدۇ. ئاۋاز خاتىرىلەنمەيدۇ، يۈكلەنمەيدۇ ۋە ھەمبەھىرلەنمەيدۇ.'],['يىغىلىدىغان ئۇچۇرلار','ھېساب، كىرىش، ئىسىم، ئېلخەت، تېلېفون، ئورۇن، ئالاقە ياكى رەسىم تەلەپ قىلىنمايدۇ.'],['يەرلىك تەڭشەكلەر','تىل، نوتا كۆرۈنۈشى، چاستوتا، ياقتۇرۇلغانلار ۋە كاتالوگ ئۈسكۈنىدە ساقلىنىشى مۇمكىن؛ مۇلازىمەتكە يوللانمايدۇ.'],['ئىنتېرنېت ۋە كاتالوگ','تەڭشەش ئۈچۈن ئىنتېرنېت كېرەك ئەمەس. تور باردا رەسمىي كاتالوگ يېڭىلىنىپ ساقلىنىشى مۇمكىن.'],['تەھلىل ۋە ئېلان','بۇ نۇسخىدا ئېلان، ئىز قوغلاش ياكى ئىشلەتكۈچى ئارخىپى SDK سى يوق.'],['سانلىق مەلۇمات ھەمبەھىرلەش','Duttarim شەخسىي ئۇچۇر ساتمايدۇ. GitHub Pages ۋە Cloudflare چەكلىك تېخنىكىلىق ئۇچۇرلارنى ئۆز سىياسىتى بويىچە بىر تەرەپ قىلىشى مۇمكىن.'],['ئالاقە','سىياسەت يېڭىلىنىشى مۇمكىن. سوئاللار ئۈچۈن duttarim.app@gmail.com غا يېزىڭ.']]}};
function render(lang){const p=policies[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ug"?"rtl":"ltr";document.getElementById('policy').innerHTML='<h1>'+p.title+'</h1><p class="updated">'+p.date+'</p><p>'+p.intro+'</p>'+p.sections.map(s=>'<h2>'+s[0]+'</h2><p>'+s[1]+'</p>').join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>render(b.dataset.lang));document.getElementById('privacyBack').onclick=()=>location.replace('index.html');render('tr');
</script></body></html>
